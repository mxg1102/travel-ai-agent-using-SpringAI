spring:
  application:
    name: ai-agent-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  ai:
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        model: ${GROQ_MODEL:openai/gpt-oss-120b}
        extra-body:
          include_reasoning: false

server:
  port: ${PORT:8082}
  address: 0.0.0.0

weatherstack:
  access-key: ${WEATHERSTACK_ACCESS_KEY:}
  base-url: ${WEATHERSTACK_BASE_URL:http://api.weatherstack.com}

rapidapi:
  booking:
    key: ${RAPIDAPI_BOOKING_KEY:}
    host: ${RAPIDAPI_BOOKING_HOST:booking-com.p.rapidapi.com}
    base-url: ${RAPIDAPI_BOOKING_BASE_URL:https://booking-com.p.rapidapi.com}
  flights:
    key: ${RAPIDAPI_FLIGHTS_KEY:}
    host: ${RAPIDAPI_FLIGHTS_HOST:booking-com15.p.rapidapi.com}
    base-url: ${RAPIDAPI_FLIGHTS_BASE_URL:https://booking-com15.p.rapidapi.com}

logging:
  level:
    org.springframework.ai: INFO
    org.springframework.ai.chat.client.advisor: INFO
